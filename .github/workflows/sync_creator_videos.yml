name: Automated 14-Creator Video Radar Sync

on:
  schedule:
    # Runs every Wednesday & Sunday at 08:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 0,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-creator-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Super Ketovore Dashboard Repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll YouTube Atom/RSS Feeds Across All 14 Creators
        run: python3 sync_creator_videos.py --check

      - name: Commit & Push Updated creator_radar_feed.json
        run: |
          if [[ -n "$(git status --porcelain creator_radar_feed.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add creator_radar_feed.json
            git commit -m "chore(radar): auto-sync 14-creator YouTube video feed [$(date -u +'%Y-%m-%d')]"
            git push
          else
            echo "No new creator feed deltas detected."
          fi
